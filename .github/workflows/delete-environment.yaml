name: Delete environment

# Fires when a branch or tag is deleted. Only branch deletions remove an
# environment; deleting a release tag does nothing.
on:
  delete:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  # For delete events github.ref_name is the default branch, so the deleted
  # branch's name comes from the event payload.
  NAMESPACE: ${{ github.event.ref }}

jobs:
  delete-environment:
    name: Delete branch environment
    if: ${{ github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'project' }}
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Delete namespace
        run: |
          # Deleting the namespace removes everything in it, including the
          # Gateway (and its load balancer) and the volume claims.
          kubectl delete namespace "$NAMESPACE" --ignore-not-found --wait=true --timeout=600s
