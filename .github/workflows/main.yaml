name: Release application

on:
  push:
    paths:
      - "the_project/**"
      - ".github/workflows/main.yaml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  BRANCH: ${{ github.ref_name }}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Form the image prefix and tag'
        run: |
          echo "IMAGE_PREFIX=$REGISTRY/$PROJECT_ID/$REPOSITORY" >> $GITHUB_ENV
          echo "TAG=${BRANCH//\//-}-$GITHUB_SHA" >> $GITHUB_ENV
          if [ "$BRANCH" = "main" ]; then
            echo "NAMESPACE=project" >> $GITHUB_ENV
          else
            echo "NAMESPACE=$BRANCH" >> $GITHUB_ENV
          fi

      - name: Build and publish images
        working-directory: the_project
        run: |
          for app in todo-app todo-backend wiki-todo-cronjob; do
            docker build --tag "$IMAGE_PREFIX/$app:$TAG" "$app"
            docker push "$IMAGE_PREFIX/$app:$TAG"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply database secret
        working-directory: the_project
        run: |
          if [ -n "$SOPS_AGE_KEY" ]; then
            curl -sSLo sops https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64
            chmod +x sops
            ./sops --decrypt secrets/todo-postgres-secret.enc.yaml \
              | sed "s/^\([[:space:]]*namespace:\).*/\1 $NAMESPACE/" \
              | kubectl apply -f -
            rm sops
          elif [ "$NAMESPACE" != "project" ]; then
            # No age key in CI: reuse the secret already in the main environment.
            kubectl -n project get secret todo-postgres-secret -o yaml \
              | sed -e "s/^\([[:space:]]*namespace:\).*/\1 $NAMESPACE/" \
                    -e '/^[[:space:]]*resourceVersion:/d' \
                    -e '/^[[:space:]]*uid:/d' \
                    -e '/^[[:space:]]*creationTimestamp:/d' \
              | kubectl apply -f -
          fi

      - name: Deploy
        working-directory: the_project
        run: |
          for app in todo-app todo-backend wiki-todo-cronjob; do
            kustomize edit set image "alirezamor2021/$app=$IMAGE_PREFIX/$app:$TAG"
          done
          kustomize edit set namespace "$NAMESPACE"
          kustomize build . | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status statefulset/todo-postgres-ss --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/todo-backend-dep --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/todo-app --timeout=300s
          kubectl -n "$NAMESPACE" get pods,services,gateway,httproute
