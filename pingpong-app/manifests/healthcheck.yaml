# pingpong-app/manifests/healthcheck.yaml
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: pingpong-healthcheck
  namespace: exercises
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /healthz
        port: 3000
  targetRef:
    group: ""
    kind: Service
    name: ping-pong-svc