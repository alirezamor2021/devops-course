# Used by the Ping-pong Rollout's canary analysis step.
# Measures the summed CPU usage rate (in cores) of every container in the
# "exercises" namespace once a minute for 5 minutes. A single measurement at or
# above the threshold fails the analysis, and Argo Rollouts reverts the update.
#
# The namespace normally idles at a few hundredths of a core, so 0.2 cores
# leaves room for normal traffic while still catching a runaway release.
# Lowering the threshold below the idle usage (e.g. 0.001) makes every update fail,
# which leaves the old version running.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage-rate
  namespace: exercises
spec:
  metrics:
  - name: cpu-usage-rate
    interval: 1m
    count: 5
    failureLimit: 0
    successCondition: result[0] < 0.2
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.prometheus.svc.cluster.local:9090
        # container!="" drops cAdvisor's pod-level totals, so each container is counted once.
        query: |
          sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!=""}[2m]))
