apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pingpong-app
  namespace: exercises
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      # Start the new version next to the old one...
      - setWeight: 50
      # ...and watch the namespace CPU for 5 minutes. If the analysis fails,
      # the rollout is aborted and only the old version keeps running.
      - analysis:
          templates:
          - templateName: cpu-usage-rate
  selector:
    matchLabels:
      app: pingpong-app
  template:
    metadata:
      labels:
        app: pingpong-app
    spec:
      containers:
      - name: pingpong
        image: alirezamor2021/pingpong:v5.1.0-amd64
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: POSTGRES_HOST
          value: "postgres-svc"
        - name: POSTGRES_DB
          value: "pingpong"
        - name: POSTGRES_USER
          value: "pingpong"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3