apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
      - name: log-writer
        image: alirezamor2021/log-output:v3.0.0
        command: ["uv", "run", "python", "writer.py"]
        volumeMounts:
        - name: shared-storage
          mountPath: /shared

      - name: log-server
        image: alirezamor2021/log-output:v3.0.0
        command: ["uv", "run", "python", "server.py"]
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        volumeMounts:
        - name: shared-storage
          mountPath: /shared

      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-pvc