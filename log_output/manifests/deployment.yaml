apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
      - name: log-writer
        image: alirezamor2021/log-output:v3.3.0
        command: ["uv", "run", "python", "writer.py"]
        env:
        - name: STATUS_FILE
          value: "/shared/status.txt"
        - name: WRITE_INTERVAL_SECONDS
          value: "5"
        volumeMounts:
        - name: shared-storage
          mountPath: /shared

      - name: log-server
        image: alirezamor2021/log-output:v3.3.0
        command: ["uv", "run", "python", "server.py"]
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: PING_PONG_URL
          value: "http://ping-pong-svc:2345/pings"
        - name: PING_TIMEOUT_SECONDS
          value: "3"
        - name: CONFIG_FILE
          value: "/config/information.txt"
        - name: STATUS_FILE
          value: "/shared/status.txt"
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: log-output-config
              key: MESSAGE
        volumeMounts:
        - name: shared-storage
          mountPath: /shared
        - name: config-volume
          mountPath: /config
          readOnly: true

      volumes:
      - name: shared-storage
        emptyDir: {}
      - name: config-volume
        configMap:
          name: log-output-config
          items:
          - key: information.txt
            path: information.txt