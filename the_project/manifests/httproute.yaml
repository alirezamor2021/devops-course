apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: project-route
  namespace: project
spec:
  parentRefs:
  - name: project-gateway
  rules:
  - matches:
    - path:
        type: Exact
        value: /break
    backendRefs:
    - name: todo-backend-svc
      port: 2345
  - matches:
    - path:
        type: PathPrefix
        value: /todos
    backendRefs:
    - name: todo-backend-svc
      port: 2345
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: todo-app-svc
      port: 2345
