apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
      - name: todo-backend
        image: alirezamor2021/todo-backend:v2.8.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        ports:
        - containerPort: 3000
        # Ready only when the database is reachable.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 2
        # Restarts the container once the app has been "broken" via POST /break.
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: PORT
          value: "3000"
        - name: DB_TIMEOUT_SECONDS
          value: "3"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_TEXT_PREVIEW_CHARS
          value: "200"
        - name: MAX_TODO_LENGTH
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: MAX_TODO_LENGTH
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: todo-db-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: todo-db-config
              key: DB_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: todo-db-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: todo-db-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-postgres-secret
              key: POSTGRES_PASSWORD