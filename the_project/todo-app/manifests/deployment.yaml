apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: alirezamor2021/todo-app:v2.2.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        ports:
        - containerPort: 5000
        # Ready only when the backend (and so the database) is ready.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 4
        livenessProbe:
          httpGet:
            path: /livez
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: PORT
          value: "5000"
        - name: IMAGE_DIR
          value: "/shared"
        - name: IMAGE_URL
          value: "https://picsum.photos/1200"
        - name: CACHE_DURATION_SECONDS
          value: "600"
        - name: TODOS_URL
          value: "/todos"
        - name: BREAK_URL
          value: "/break"
        - name: BACKEND_HEALTH_URL
          value: "http://todo-backend-svc:2345/healthz"
        - name: HEALTH_TIMEOUT_SECONDS
          value: "3"
        - name: MAX_TODO_LENGTH
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: MAX_TODO_LENGTH
        volumeMounts:
        - name: shared-storage
          mountPath: /shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-pvc