apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
  labels:
    app: todo-app
spec:
  type: NodePort
  selector:
    app: todo-app
  ports:
    - port: 5000          # The port inside the cluster
      targetPort: 5000    # The container port
      nodePort: 30080     # The static port opened on your cluster nodes (optional, valid range: 30000-32767)